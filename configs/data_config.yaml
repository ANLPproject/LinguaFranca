# ────────────────────────────────────────────────────────────────────────────
# LinguaFranca — Data Pipeline Config
# ────────────────────────────────────────────────────────────────────────────

# ── Model ────────────────────────────────────────────────────────────────────
model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  dtype: "float16"           # float16 | bfloat16
  device_map: "auto"         # "auto" lets accelerate decide GPU/CPU split
  trust_remote_code: true    # set true for Qwen models

# ── Paths ────────────────────────────────────────────────────────────────────
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  hidden_states_dir: "data/hidden_states"

  splits:
    train: 0.60
    val:   0.20
    test:  0.20

  # How many examples to sample from 2WikiMultihopQA BEFORE augmentation.
  # After counterfactual augmentation the final count will be higher.
  #
  # LAYER SELECTION WORKFLOW (practical 3-step):
  #   Step 1 — Set n_source_examples: 200 and layers: "all", then run.
  #             This is the cheap pilot (36 layers x 200 examples ≈ trivial cost).
  #   Step 2 — Run phase2_probing to train a quick linear probe per layer on
  #             the pilot output. Plot accuracy vs layer depth to find the
  #             informative range (usually a clear peak in the middle layers).
  #   Step 3 — Lock the 5-8 best layers (e.g. [8,12,16,20,24,28]) into the
  #             layers list below, bump n_source_examples back to 8000, and
  #             re-run.  Storage and runtime drop by ~6-7x.
  n_source_examples: 2000   # Set to 2000 for your main run

  # dataset_offset (optional, default 0): skip this many compositional examples
  # of the shuffled pool.  The released 4,000-example dataset was generated in
  # TWO Kaggle batches: offset=0,n=2000 and offset=2000,n=2000, appended into
  # one generated_cot.jsonl.  kaggle_phase1.ipynb sets offset=2000 (batch 2);
  # to regenerate batch 1, set it to 0 there.
  # dataset_offset: 0

  datasets:
    "2wikimultihopqa":
      hf_path: "framolfese/2WikiMultihopQA"
      hf_split: "train"         # we do our own 60/20/20 split
    hotpotqa:
      hf_path: "hotpot_qa"
      hf_config: "distractor"
      hf_split: "validation"    # used only for OOD evaluation; ~7.4k items

  # How many HotpotQA validation examples to use for OOD evaluation.
  n_ood_examples: 500

# ── Entity Matching ──────────────────────────────────────────────────────────
matching:
  sbert_model: "sentence-transformers/all-MiniLM-L6-v2"
  sbert_threshold: 0.70          # cosine threshold for tier-2 match (lowered from 0.75 to reduce near-miss false failures)
  wikidata_aliases_path: "data/raw/wikidata_aliases.json"
  sparql_rate_limit_sec: 0.5     # be polite to Wikidata endpoint
  use_llm_fallback: true
  # Max fraction of matcher calls that may go to the LLM judge.  The judge is
  # only consulted after string/alias/SBERT all fail; in the released run it was
  # used for ~60 hops in total, so 1.0 is not a speed problem.  Kept at 1.0 so a
  # re-run reproduces the released labels.
  llm_fallback_budget: 1.0

# ── CoT Generation ───────────────────────────────────────────────────────────
generation:
  batch_size: 4          # 3B model on T4 x1 comfortably fits batch=4; increase to 8 on T4 x2
  max_new_tokens: 400
  temperature: 0.0               # greedy decoding for reproducibility
  do_sample: false
  max_hops: 4                    # upper bound on <hopN> tags we look for

  # Prompt template — {question} is substituted at runtime
  system_prompt: |
    You are a careful multi-hop reasoning assistant. You will be given a Context
    (a set of passages) and a Question. Base EVERY reasoning step strictly on
    facts stated in the Context — do NOT use outside knowledge or memorized
    facts, and do NOT guess if the Context does not support a step.

    For each reasoning step, identify the key entity or fact FROM THE CONTEXT
    that advances toward the answer. State that entity or fact explicitly.
    Wrap each step in numbered XML hop tags, then give the final answer.

    Example:
    Context:
    Title: Inception
    Inception is a 2010 science fiction film directed by Christopher Nolan.
    Title: Christopher Nolan
    Christopher Edward Nolan is a British and American filmmaker.

    Question: What nationality is the director of Inception?
    <hop1>From the context, I find that the director of Inception is Christopher Nolan.</hop1>
    <hop2>From the context, I find that Christopher Nolan is British and American.</hop2>
    <answer>British and American</answer>

    REQUIRED OUTPUT FORMAT (follow exactly):
    <hop1>From the context, I find that [key entity or fact for step 1].</hop1>
    <hop2>From the context, I find that [key entity or fact for step 2].</hop2>
    <answer>Final answer here.</answer>

    Do not skip steps. Do not add any text outside the tags.

# ── Hidden State Extraction ──────────────────────────────────────────────────
hidden_states:
  extract: true
  # Layer selection:
  #   "all"        → every transformer layer  (use for the pilot run only)
  #   [8,12,16,20,24,28]  → locked layers after probing the pilot output
  #
  # Workflow:
  #   1. Run with layers: "all" on the 200-example pilot.
  #   2. Train a probe per layer (phase2_probing), plot accuracy vs depth.
  #   3. Pick the 5-8 peak/informative layers and set them here.
  #   4. Flip n_source_examples back to 8000 and re-run full extraction.
  layers: "all"   # PILOT: switch to e.g. [8,12,16,20,24,28] after probing
  pooling: "mean"               # mean-pool over hop token span for probe training
  save_single_token: false      # set to true ONLY for the small patching subset to save storage

# ── Counterfactuals ──────────────────────────────────────────────────────────
counterfactuals:
  # Hop-level failure ratio over LABELED hops (0/1) only.  With extra hops now
  # unlabeled (-1), natural data is ~24 % failing on hops 1-2, so 0.45 would ask
  # for ~1,800 counterfactuals.  The released dataset has 78 (see FIXES_AND_RERUN.md).
  target_failure_ratio: 0.45
  max_substitution_attempts: 3  # tries per example before giving up
  chunk_size: 32                # process in batches of 32 candidates
  gen_batch_size: 4             # safe size for Kaggle T4x2
  max_new_tokens: 160           # cap token generation for speed
  max_minutes: 600              # cleanly stop before Kaggle 12-hour timeout
  validate_induced_failure: true

# ── Reproducibility ──────────────────────────────────────────────────────────
seed: 42
